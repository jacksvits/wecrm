# SNI-роутинг внешнего HTTPS (порт 443) + HTTP-редиректы (порт 80).
# HTTPS: SNI welans.cc + *.welans.cc -> хостовый nginx :10443 (wildcard ZeroSSL,
# автообновление acme.sh), остальное -> NAS 192.168.8.3:443 (чужие сайты без изменений).
# HTTP: Host *.welans.cc -> 301 на HTTPS, остальное -> NAS :80 (чужие сайты как раньше).
# Контейнер в network_mode: host (нужны loopback хоста и LAN).
global
    maxconn 8192

defaults
    mode tcp
    option tcplog
    timeout connect 5s
    timeout client 3600s
    timeout server 3600s

frontend sni_router
    bind 0.0.0.0:443
    tcp-request inspect-delay 5s
    tcp-request content accept if { req_ssl_hello_type 1 }
    acl is_crm req_ssl_sni -i welans.cc
    acl is_crm req_ssl_sni -m end .welans.cc
    use_backend crm if is_crm
    default_backend nas

backend crm
    server crm 127.0.0.1:10443 check inter 5s fall 2 rise 1

backend nas
    server nas 192.168.8.3:443 check inter 5s fall 2 rise 1

# HTTP (80): редирект тенантов на HTTPS, остальное на NAS без изменений.
frontend http_router
    bind 192.168.8.145:80  # LAN-IP: 0.0.0.0 конфликтует с nginx на 127.0.0.1:80
    mode http
    acl is_crm hdr(host) -i welans.cc
    acl is_crm hdr(host) -m end .welans.cc
    http-request redirect scheme https if is_crm
    default_backend nas_http

backend nas_http
    mode http
    server nas 192.168.8.3:80 check inter 5s fall 2 rise 1
