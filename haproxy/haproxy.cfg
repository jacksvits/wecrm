# SNI-роутинг внешнего HTTPS (порт 443).
# SNI welans.cc + *.welans.cc -> хостовый nginx :10443 (wildcard ZeroSSL, автообновление acme.sh).
# Всё остальное (welans.org, edringcolony.ru и пр.) -> NAS 192.168.8.3:443 (DSM RP, без изменений).
# Контейнер работает в network_mode: host (нужны loopback хоста и LAN).
global
    maxconn 8192

defaults
    mode tcp
    option tcplog
    timeout connect 5s
    timeout client 3600s
    timeout server 3600s

frontend sni_router
    bind 0.0.0.0:443
    tcp-request inspect-delay 5s
    tcp-request content accept if { req_ssl_hello_type 1 }
    acl is_crm req_ssl_sni -i welans.cc
    acl is_crm req_ssl_sni -m end .welans.cc
    use_backend crm if is_crm
    default_backend nas

backend crm
    server crm 127.0.0.1:10443 check inter 5s fall 2 rise 1

backend nas
    server nas 192.168.8.3:443 check inter 5s fall 2 rise 1
