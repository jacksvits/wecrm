# Публичные домены проекта (2026-11-09):
#   welans.ru    -> статическая страница frontend/public/welans/index.html (как welans.cc/welans/index.html)
#   welans.click -> SPA, авто-вход гостем на страницу «Файлы» (/files)
#   welans.org   -> страница /org-login
# Установка: sudo cp nginx/host/welans-extra.conf /etc/nginx/sites-available/welans-extra
#            sudo ln -s ../sites-available/welans-extra /etc/nginx/sites-enabled/welans-extra
# TLS терминируется здесь (HAProxy SNI-роутер передаёт PROXY v2 на 127.0.0.1:10443).
# Сертификаты: Let's Encrypt через webroot /var/www/certbot (ACME проброшен в HAProxy).
# Для welans.ru до переноса A-записи на 89.23.5.137 — временный самоподписанный сертификат;
# после переноса DNS выполнить scripts/issue-welans-ru-cert.sh.

# ---- HTTP: приём ACME-challenge Let's Encrypt + редирект на HTTPS ----
server {
    listen 127.0.0.1:80;
    server_name welans.ru www.welans.ru welans.click www.welans.click welans.org www.welans.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- welans.click: «Файлы» без авторизации (авто-вход гостем в SPA) ----
server {
    listen 127.0.0.1:10443 ssl http2 proxy_protocol;  # внешний 443 занят stream SNI-роутером

    # HAProxy передаёт реальный IP внешнего клиента через PROXY protocol.
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;

    # Max upload size: 2 GB (совпадает с лимитом multer на бэкенде и client_max_body_size во frontend-контейнере)
    client_max_body_size 2G;

    # Timeouts for large file uploads
    proxy_read_timeout 600s;
    proxy_connect_timeout 600s;
    proxy_send_timeout 600s;

    server_name welans.click www.welans.click;
    ssl_certificate /etc/letsencrypt/live/welans.click/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/welans.click/privkey.pem;

    # PWA: index.html с данными главной организации
    location = / {
        proxy_pass http://127.0.0.1:4000/pwa-index;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSE-стрим уведомлений: без буферизации, длинные таймауты (иначе 504 от прокси)
    location /api/notifications/stream {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

