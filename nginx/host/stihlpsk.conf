# stihlpsk.ru — статическая копия сайта магазина (2026-11-17).
# Контейнер stihl-site (Dockerfile: stihl-site/Dockerfile) слушает 127.0.0.1:8088.
# HAProxy SNI stihlpsk.ru -> здесь (PROXY v2), TLS — Let's Encrypt (certbot, webroot /var/www/certbot).
# Установка: sudo cp nginx/host/stihlpsk.conf /etc/nginx/sites-available/stihlpsk
#            sudo ln -s ../sites-available/stihlpsk /etc/nginx/sites-enabled/stihlpsk
# Сертификат: certbot --webroot -w /var/www/certbot -d stihlpsk.ru -d www.stihlpsk.ru
#             (выпускать ПОСЛЕ смены A-записи домена на IP сервера 89.23.5.137)

server {
    listen 127.0.0.1:80;
    server_name stihlpsk.ru www.stihlpsk.ru;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://stihlpsk.ru$request_uri;
    }
}

server {
    listen 127.0.0.1:10443 ssl http2 proxy_protocol;

    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;

    server_name stihlpsk.ru www.stihlpsk.ru;
    ssl_certificate /etc/letsencrypt/live/stihlpsk.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stihlpsk.ru/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
