# stihlpsk.ru — статическая копия сайта магазина (2026-11-17).
# Тенант определяется по Host-заголовку (см. backend/src/lib/tenant.ts):
#   stihlpsk.ru / www.stihlpsk.ru / stihlpsk.welans.cc -> слаг "stihlpsk".
# /shop, /news, /api, /assets, /manifest -> контейнеры CRM (витрина тенанта),
# остальное -> статическая копия (контейнер stihl-site :8088).
# TLS: Let's Encrypt /etc/letsencrypt/live/stihlpsk.ru-0001/
# Установка: sudo ln -s ../sites-available/stihlpsk /etc/nginx/sites-enabled/stihlpsk

server {
    listen 127.0.0.1:80;
    server_name stihlpsk.ru www.stihlpsk.ru;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://stihlpsk.ru$request_uri;
    }
}

server {
    listen 127.0.0.1:10443 ssl http2 proxy_protocol;

    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;

    server_name stihlpsk.ru www.stihlpsk.ru;
    ssl_certificate /etc/letsencrypt/live/stihlpsk.ru-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stihlpsk.ru-0001/privkey.pem;

    # --- Витрина тенанта (CRM) ---
    location /shop {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /news {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
    location /assets/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /manifest.json {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }
    # --- Тенантные файлы (брендинг, промо-картинки и т.д.) ---
    location /tenants/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Статическая копия ---
    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
