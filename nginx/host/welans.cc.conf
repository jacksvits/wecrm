server {
    listen 80;
    listen 443 ssl;
    server_name welans.cc;
    ssl_certificate /etc/nginx/ssl/welans.crt;
    ssl_certificate_key /etc/nginx/ssl/welans.key;

    # Автоматический редирект с HTTP на HTTPS.
    # Внешний трафик welans.cc проходит через reverse proxy NAS (192.168.8.3):
    # NAS терминирует HTTPS (сертификат Let's Encrypt) и передаёт запросы сюда
    # по HTTP с заголовком X-Forwarded-Proto: http|https. Редиректим только
    # реальные http-запросы, иначе https-трафик от NAS зациклится (он приходит
    # на порт 80 с заголовком X-Forwarded-Proto: https).
    if ($http_x_forwarded_proto != "https") {
        return 301 https://$host$request_uri;
    }

    # Max upload size: 2 GB (совпадает с лимитом multer на бэкенде и client_max_body_size во frontend-контейнере)
    client_max_body_size 2G;

    # Timeouts for large file uploads
    proxy_read_timeout 600s;
    proxy_connect_timeout 600s;
    proxy_send_timeout 600s;

    # PWA: index.html и manifest.json с данными конкретного tenant'а
    # (iOS «Добавить на экран Домой» и краулеры читают мета-теги до выполнения JS)
    location = / {
        proxy_pass http://127.0.0.1:4000/pwa-index;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /manifest.json {
        proxy_pass http://127.0.0.1:4000/manifest.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSE-стрим уведомлений: без буферизации, длинные таймауты (иначе 504 от прокси)
    location /api/notifications/stream {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
