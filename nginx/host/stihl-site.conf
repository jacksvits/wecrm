# stihl.welans.cc — статическая копия сайта stihlpsk.ru (2026-11-17).
# Контейнер stihl-site (Dockerfile: stihl-site/Dockerfile) слушает 127.0.0.1:8088.
# HAProxy SNI *.welans.cc -> здесь (PROXY v2), TLS — wildcard ZeroSSL welans.cc.
# Установка: sudo cp nginx/host/stihl-site.conf /etc/nginx/sites-available/stihl-site
#            sudo ln -s ../sites-available/stihl-site /etc/nginx/sites-enabled/stihl-site

server {
    listen 127.0.0.1:10443 ssl http2 proxy_protocol;

    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;

    server_name stihl.welans.cc stihlpsk.welans.cc;
    ssl_certificate /etc/nginx/ssl/welans.crt;
    ssl_certificate_key /etc/nginx/ssl/welans.key;

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
