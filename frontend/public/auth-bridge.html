<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="robots" content="noindex" />
<title>WeCRM Auth Bridge</title>
</head>
<body>
<script>
// Мост авторизации WeCRM (редирект-вариант).
// Публичные страницы на сторонних доменах (welans.ru, welans.click) не могут читать
// localStorage домена welans.cc из-за изоляции хранилищ в современных браузерах,
// поэтому при первом визите такая страница перенаправляет сюда (welans.cc —
// first-party, токен доступен), а мост возвращает обратно в адресной строке хэш
// с профилем (#wecrm-user=...) или #wecrm-guest.
(function () {
  var back = 'https://welans.ru/';
  try {
    var q = new URLSearchParams(location.search).get('back') || '';
    // возврат разрешён только на публичные домены WeLANS (welans.ru, welans.click)
    if (/^https:\/\/(www\.)?(welans\.ru|welans\.click|welans\.org)\//.test(q)) back = q;
  } catch (e) {}
  function done(hash) {
    location.replace(back.split('#')[0] + hash);
  }
  var token = null;
  try { token = localStorage.getItem('token'); } catch (e) {}
  if (!token) { done('#wecrm-guest'); return; }
  fetch('/api/auth/me', { headers: { 'X-Auth-Token': token } })
    .then(function (r) { if (!r.ok) throw new Error('unauthorized'); return r.json(); })
    .then(function (u) {
      var payload;
      try {
        // token в хэше: витринные домены сохраняют его и могут делать авторизованные запросы (комментарии и т.п.)
        payload = btoa(unescape(encodeURIComponent(JSON.stringify({ name: u.name || '', avatar: u.avatar || '', token: token || '' }))));
      } catch (e) { done('#wecrm-guest'); return; }
      done('#wecrm-user=' + payload);
    })
    .catch(function () { done('#wecrm-guest'); });
})();
</script>
</body>
</html>
