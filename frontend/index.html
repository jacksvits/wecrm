<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#00b300" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#008f00" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="WeCRM" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <title>WeCRM</title>
  <style>
    /* === Critical CSS — inline fallback until Vite stylesheets load === */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { background: #f5f5f7; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-body, #f5f5f7);
      color: var(--text-primary, #1a1a1a);
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body>
  <!-- === Видео-заставка при загрузке PWA (на весь экран, только мобильные) === -->
  <style>
    #wecrm-splash {
      position: fixed; inset: 0; z-index: 99999;
      background: #0a0a0f;
      transition: opacity 0.5s ease;
    }
    #wecrm-splash.hide { opacity: 0; pointer-events: none; }
    #wecrm-splash video {
      width: 100%; height: 100%;
      object-fit: cover; /* обрезка по ширине экрана */
    }
  </style>
  <div id="wecrm-splash" hidden>
    <video id="wecrm-splash-video" src="/splash.mp4"
           autoplay muted playsinline preload="auto"></video>
  </div>
  <script>
    (function () {
      var el = document.getElementById('wecrm-splash');
      var video = document.getElementById('wecrm-splash-video');
      var isMobile = window.matchMedia('(max-width: 900px)').matches
        || 'ontouchstart' in window;
      var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      // Заставка показывается один раз за сессию (при повторных переходах/обновлениях — нет)
      var shown = false;
      try { shown = sessionStorage.getItem('wecrm-splash-shown') === '1'; } catch (e) {}

      if (!isMobile || reduced || shown || !video) {
        if (el) el.remove();
        window.__wecrmAppReady = true;
        return;
      }

      try { sessionStorage.setItem('wecrm-splash-shown', '1'); } catch (e) {}

      var videoDone = false, appReady = false, hidden = false;
      el.hidden = false;

      function tryHide() {
        if (hidden || !videoDone || !appReady) return;
        hidden = true;
        el.classList.add('hide');
        setTimeout(function () { el.remove(); }, 600);
      }
      // React сигнализирует о готовности через __wecrmSplashCheck (см. AuthContext)
      window.__wecrmSplashCheck = function () {
        appReady = true;
        tryHide();
      };
      // Видео проигрывается один раз — после 'ended' фейд к приложению
      video.addEventListener('ended', function () {
        videoDone = true;
        tryHide();
      });
      // Фолбэки: ошибка видео или лимит времени — не блокируем вход
      video.addEventListener('error', function () {
        videoDone = true;
        tryHide();
      });
      setTimeout(function () {
        videoDone = true;
        tryHide();
      }, 15000);
      // Абсолютный предел: заставка не держится дольше 20 секунд
      setTimeout(function () {
        if (!hidden) { hidden = true; el.classList.add('hide'); setTimeout(function () { el.remove(); }, 600); }
      }, 20000);
      var p = video.play();
      if (p && p.catch) p.catch(function () {
        videoDone = true; tryHide();
      });
    })();
  </script>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
