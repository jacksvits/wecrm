server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Max upload size: 2 GB
    client_max_body_size 2G;

    # Timeouts for large file uploads
    proxy_read_timeout 600s;
    proxy_connect_timeout 600s;
    proxy_send_timeout 600s;

    # index.html — NEVER cache
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires off;
        try_files $uri =404;
    }

    # API — proxy to backend (must be before regex locations)
    location ^~ /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # UPLOADS — proxy to backend (must be before regex locations, ^~ prevents regex match)
    location ^~ /uploads/ {
        proxy_pass http://backend:4000/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Assets (JS/CSS from Vite build) — cache forever, NO fallback to index.html
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        expires 1y;
        try_files $uri =404;
    }

    # JS/CSS files — cache forever
    location ~* \.(js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        expires 1y;
        try_files $uri =404;
    }

    # Images/fonts — cache 1 week
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        add_header Cache-Control "public, max-age=604800" always;
        expires 1w;
        try_files $uri =404;
    }

    # Service Worker — never cache
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
        expires off;
        try_files $uri =404;
    }

    # All other routes -> index.html (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
