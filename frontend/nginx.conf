# WebSocket upgrade для /api/push/ws (нативный Android-клиент): без этого nginx
# обрывал бы Upgrade-заголовок, а SSE-потоки (/api/chat) не ломаются — для них
# $http_upgrade пустой и Connection остаётся пустым, как раньше
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' '';
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Витрина переехала с /vitrine на /shop (301 для поисковиков и старых ссылок)
    location = /vitrine { return 301 https://$host/shop; }

    # Max upload size: 2 GB
    client_max_body_size 2G;

    # Gzip compression for faster asset delivery
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/rss+xml
        text/javascript
        image/svg+xml
        application/vnd.ms-fontobject
        font/ttf
        font/otf
        font/x-woff
        font/woff2;

    # Timeouts for large file uploads
    proxy_read_timeout 600s;
    proxy_connect_timeout 600s;
    proxy_send_timeout 600s;

    # index.html — NEVER cache
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires off;
        try_files $uri =404;
    }

    # Docker-embedded DNS: контейнерные имена резолвим на каждый запрос —
    # статический proxy_pass кеширует IP со старта nginx, и после пересоздания
    # backend-контейнера с новым IP все upstream'ы отдают 502 (см. инцидент
    # 2026-11-16: записи звонков и файлы /uploads не отдавались)
    resolver 127.0.0.11 valid=30s ipv6=off;

    # API — proxy to backend (must be before regex locations)
    location ^~ /api/ {
        set $crm_backend "http://backend:4000";
        proxy_pass $crm_backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_hide_header Cache-Control;
        # SSE (text/event-stream) требует HTTP/1.1 к бэкенду и отключения буферизации,
        # иначе nginx ждёт конца ответа и закрывает соединение по таймауту ~60с
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        # API responses must not be cached by nginx proxy
        expires off;
    }

    # UPLOADS — proxy to backend (must be before regex locations, ^~ prevents regex match)
    location ^~ /uploads/ {
        set $crm_backend "http://backend:4000";
        proxy_pass $crm_backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_hide_header Cache-Control;
        # API responses must not be cached by nginx proxy
        expires off;
    }

    location ^~ /tenants/ {
        set $crm_backend "http://backend:4000";
        proxy_pass $crm_backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_hide_header Cache-Control;
        expires off;
    }

    # Assets (JS/CSS from Vite build) — cache forever, NO fallback to index.html
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        expires 1y;
        try_files $uri =404;
    }

    # JS/CSS files — cache forever
    location ~* \.(js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        expires 1y;
        try_files $uri =404;
    }

    # Images/fonts — cache 1 week
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        # API responses must not be cached by nginx proxy
        expires off;
        try_files $uri =404;
    }

    # Splash video — cache 1 week (SW кеширует его после первого показа, повторные запуски — мгновенно)
    location = /splash.mp4 {
        add_header Cache-Control "public, max-age=604800" always;
        expires 1w;
        try_files $uri =404;
    }

    # Service Worker — never cache
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
        expires off;
        try_files $uri =404;
    }

    # Публичны только два известных APK. Никакие другие файлы из backup/download
    # (в частности SQL-дампы) через этот маршрут не отдаются.
    location = /app-downloads/wecrm-twa.apk {
        alias /usr/share/nginx/html/uploads/backup/download/wecrm-twa.apk;
        types { application/vnd.android.package-archive apk; }
        add_header Content-Disposition "attachment" always;
        add_header Cache-Control "public, max-age=86400" always;
    }
    location = /app-downloads/wecrm-nogoogle.apk {
        alias /usr/share/nginx/html/uploads/backup/download/wecrm-nogoogle.apk;
        types { application/vnd.android.package-archive apk; }
        add_header Content-Disposition "attachment" always;
        add_header Cache-Control "public, max-age=86400" always;
    }
    location /app-downloads/ { return 404; }
    location ^~ /uploads/backup/ { return 404; }

    # Digital Asset Links для TWA (проверка подписи APK ↔ домен)
    location = /.well-known/assetlinks.json {
        default_type application/json;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires off;
        try_files $uri =404;
    }

    # All other routes -> index.html (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
